name: Transcribe acquisition.com five-books audio

on:
  push:
    branches:
      - claude/transcribe-acquisition-audio-wn0s9c
  workflow_dispatch: {}

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Capture media URL with headless Chromium
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium
          python - <<'EOF'
          import asyncio, re
          from playwright.async_api import async_playwright

          EMBED = "https://play.hubspotvideo.com/v/21368823/id/205078244450?play_button_color=ffffff"
          media = []

          def sniff(url):
              if re.search(r'\.(mp4|m3u8|mp3|m4a|webm|aac)([?#]|$)', url) or 'r2.dev' in url:
                  media.append(url)

          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(args=["--autoplay-policy=no-user-gesture-required"])
                  pg = await b.new_page()
                  pg.on("request", lambda r: sniff(r.url))
                  await pg.goto(EMBED, wait_until="load", referer="https://www.acquisition.com/five-books")
                  await pg.wait_for_timeout(5000)
                  for sel in ["video", "button", ".play", "[class*=play]"]:
                      try:
                          await pg.click(sel, timeout=2000)
                          break
                      except Exception:
                          pass
                  await pg.wait_for_timeout(8000)
                  srcs = await pg.eval_on_selector_all(
                      "video, video source",
                      "els => els.map(e => e.currentSrc || e.src).filter(Boolean)")
                  media.extend(srcs)
                  await b.close()

          asyncio.run(main())
          uniq = list(dict.fromkeys(media))
          print("=== MEDIA URLS ===")
          for u in uniq:
              print(u)
          with open("media_urls.txt", "w") as f:
              f.write("\n".join(uniq))
          EOF

      - name: Extract audio track
        run: |
          MEDIA=$(grep -vE '\.ts([?#]|$)' media_urls.txt | head -1)
          if [ -z "$MEDIA" ]; then echo "NO MEDIA URL FOUND"; exit 1; fi
          echo "Extracting audio from: $MEDIA"
          ffmpeg -y -loglevel error -user_agent "Mozilla/5.0" -i "$MEDIA" -vn -ac 1 -ar 16000 audio_file.wav
          ls -la audio_file.wav

      - name: Transcribe with Whisper
        run: |
          pip install --quiet faster-whisper
          python - <<'EOF'
          from faster_whisper import WhisperModel
          model = WhisperModel("base", device="cpu", compute_type="int8")
          segments, info = model.transcribe("audio_file.wav")
          print(f"language={info.language} duration={info.duration:.1f}s")
          print("=== TRANSCRIPT START ===")
          for s in segments:
              print(f"[{s.start:7.1f}-{s.end:7.1f}] {s.text}")
          print("=== TRANSCRIPT END ===")
          EOF
